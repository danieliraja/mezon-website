server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # com build.format = 'file', /contato precisa resolver para /contato.html
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # rotas antigas em inglês -> novas em português
  location = /contact  { return 301 /contato; }
  location = /services { return 301 /servicos; }
  location = /privacy  { return 301 /privacidade; }
  location = /terms    { return 301 /termos; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
